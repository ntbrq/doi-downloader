[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doi-downloader"
version = "0.1.0"
description = "Batch DOI paper PDF downloader with multi-source fallback"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "click>=8.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "respx>=0.21",
]

[project.scripts]
doi-downloader = "doi_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doi_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
